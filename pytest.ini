[pytest]
# Pytest configuration for AI Agent tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    -ra
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --cov-config=.coveragerc

# Async support
asyncio_mode = auto

# Markers for organizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (require external services)
    slow: Slow tests
    auth: Authentication tests
    tools: Tool tests
    agent: Agent tests
    api: API endpoint tests
    live: needs the local stacks + real LLM keys; skipped unless WAJ_LIVE_EVAL=1

# Minimum Python version
minversion = 3.11

# Log settings
log_cli = false
log_cli_level = WARNING

