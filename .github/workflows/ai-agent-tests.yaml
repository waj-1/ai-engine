name: AI Agent Tests

# Runs the AI engine pytest suite on every PR and on pushes to main. The suite
# is hermetic — no external services are needed (see tests/admin/conftest.py,
# which routes the admin handlers' Supabase accessors to in-memory fakes).
# Historically pytest was never wired into CI, so 100+ failures accumulated on
# main unnoticed; this gate prevents that.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python (matches the prod Dockerfile — python:3.11-slim)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: pip install -r requirements.lock
      - name: Run lint
        run: make lint
  mcp-smoke:
    name: mcp-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python (matches the prod Dockerfile — python:3.11-slim)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: pip install -r requirements.lock
      - name: Run mcp-smoke
        run: make mcp-smoke
  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build .
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    # A test that blocks on an unbounded ws.receive_json() (see
    # tests/voice/test_voice_live_endpoint.py::_read_until) hangs rather
    # than fails, and pytest-timeout is not installed — without this the
    # job would sit on GitHub's 6-hour default. The suite runs in ~6min.
    timeout-minutes: 25
    env:
      # The suite is hermetic. Point Supabase at dead ports so any accidental
      # real-DB access fails loudly (ConnectError) instead of silently hitting
      # a live instance or hanging. Values are dummy — nothing real is reached.
      ENVIRONMENT: development
      SUPABASE_URL: http://127.0.0.1:59998
      SUPABASE_ANON_KEY: test-anon
      SUPABASE_SERVICE_KEY: test-service
      SUPABASE_JWT_SECRET: test-jwt-secret
      AI_SUPABASE_URL: http://127.0.0.1:59999
      AI_SUPABASE_ANON_KEY: test-ai-anon
      AI_SUPABASE_SERVICE_KEY: test-ai-service
      GOOGLE_API_KEY: test-google
      OPENAI_API_KEY: test-openai
      ALLOWED_ORIGINS: "*"
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (matches the prod Dockerfile — python:3.11-slim)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        # requirements.lock, not requirements.txt: the latter pins 42 of the
        # ~190 packages an install actually resolves, so every run picked up
        # whatever the resolver felt like that day. On 2026-08-17 a dev
        # checkout and a fresh install of the same requirements.txt differed
        # in 35 packages and collected a different number of tests — a commit
        # passed locally and failed here. The lock is compiled on linux/amd64
        # Python 3.11 (see `make lock`), matching this runner and the prod
        # image, so it installs verbatim.
        run: pip install -r requirements.lock

      - name: Run pytest
        # pytest.ini already sets -v/--tb=short/--cov; keep the run deterministic.
        run: python -m pytest tests/ -p no:cacheprovider
